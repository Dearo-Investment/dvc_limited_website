<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <clipPath id="sq4-clip-full">
      <rect x="108" y="108" width="84" height="84" rx="6" />
    </clipPath>
  </defs>

  <!-- 2x2 Grid Mark -->
  <!-- Top-Left: D -->
  <rect x="8" y="8" width="84" height="84" rx="6" fill="#2E1B54" />
  <text x="50" y="54" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">D</text>

  <!-- Top-Right: V -->
  <rect x="108" y="8" width="84" height="84" rx="6" fill="#2E1B54" />
  <text x="150" y="54" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">V</text>

  <!-- Bottom-Left: C -->
  <rect x="8" y="108" width="84" height="84" rx="6" fill="#2E1B54" />
  <text x="50" y="154" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">C</text>

  <!-- Bottom-Right: Diagonal Design -->
  <g clip-path="url(#sq4-clip-full)">
    <rect x="108" y="108" width="84" height="84" fill="#2E1B54" />
    <polygon points="108,192 192,108 192,192" fill="#8B5CF6" />
    <polygon points="108,162 108,192 192,108 162,108" fill="#F3F4F6" />
  </g>

  <!-- Typography -->
  <!-- Line 1: DEVELOPMENT VENTURE -->
  <text x="215" y="85" font-family="'Inter', system-ui, sans-serif" font-size="27" font-weight="800" letter-spacing="2.5" fill="#FFFFFF">DEVELOPMENT VENTURE</text>

  <!-- Line 2: CAPITAL CORPORATION LIMITED -->
  <text x="215" y="132" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="3.2" fill="#C6A15B">CAPITAL CORPORATION LIMITED</text>
</svg>
